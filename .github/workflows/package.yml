name: Package

# Runs once semantic-release has published a GitHub release. The release is
# created with PAT_TOKEN, not the default GITHUB_TOKEN, which is what allows
# this event to fire at all.
on:
  release:
    types: [published]

jobs:
  package:
    name: Helm package
    runs-on: ubuntu-latest

    permissions:
      contents: write   # upload the .tgz to the release
      packages: write   # push the chart to ghcr.io

    steps:
      # The release event checks out the tag. The tag points at the
      # chore(release) commit, so Chart.yaml already carries the new version.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Check the chart version against the tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          chart=$(awk '/^version:/{print $2}' Chart.yaml)
          if [ "v$chart" != "$TAG" ]; then
            echo "::error::Chart.yaml version $chart does not match tag $TAG"
            exit 1
          fi

      - name: Lint
        run: helm lint .

      - name: Package
        run: helm package . --destination dist

      - name: Upload the chart to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/*.tgz --clobber

      # The chart lands at oci://ghcr.io/<owner>/charts/garage-webui. OCI
      # references must be lowercase, so the owner name is lowercased.
      - name: Push the chart to the GitHub Container Registry
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
        run: |
          owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
          helm push dist/*.tgz "oci://ghcr.io/$owner/charts"
