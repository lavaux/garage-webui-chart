apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "garage-webui.fullname" . }}-test-connection"
  labels:
    {{- include "garage-webui.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: wget
      image: busybox:1.37
      command: ["wget", "-q", "-O", "/dev/null"]
      args: ["http://{{ include "garage-webui.fullname" . }}:{{ .Values.service.port }}{{ .Values.basePath }}/"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
